<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日程調整</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#6b7385;--line:#e2e5eb;--pri:#3b5bdb;--priText:#fff;--ok:#2f9e44;--maybe:#e8a317;--ng:#c92a2a;--best:#e7f5ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1e2128;--text:#eceef3;--sub:#9aa2b4;--line:#2f3340;--pri:#748ffc;--priText:#10131a;--ok:#51cf66;--maybe:#fcc419;--ng:#ff6b6b;--best:#1d3326}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1e2128;--text:#eceef3;--sub:#9aa2b4;--line:#2f3340;--pri:#748ffc;--priText:#10131a;--ok:#51cf66;--maybe:#fcc419;--ng:#ff6b6b;--best:#1d3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.sub{color:var(--sub);font-size:13px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px}
button.pri{background:var(--pri);color:var(--priText);border-color:var(--pri);font-weight:600}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.opts{display:flex;gap:6px}.opts button{width:44px;padding:8px 0;font-size:18px}
.opts button.on[data-v=o]{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.on[data-v=t]{background:var(--maybe);color:#222;border-color:var(--maybe)}
.opts button.on[data-v=x]{background:var(--ng);color:#fff;border-color:var(--ng)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{font-weight:600;font-size:12px}td.n,th.n{text-align:left;position:sticky;left:0;background:var(--card)}
.best{background:var(--best)}tfoot td{font-size:12px;color:var(--sub)}
.o{color:var(--ok)}.t{color:var(--maybe)}.x{color:var(--ng)}
.msg{color:var(--sub);text-align:center;padding:24px 0}
.chip{display:inline-block;background:var(--best);color:var(--ok);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.wd{display:flex;gap:4px;margin:8px 0}.wd button{flex:1;padding:8px 0}.wd button.on{background:var(--pri);color:var(--priText);border-color:var(--pri)}
.g td{padding:3px}.g th{padding:6px 10px}.none{color:var(--sub)}
.cell,.cnt{width:100%;min-width:56px;padding:8px 4px;font-size:18px}
.cell.o{background:var(--ok);color:#fff;border-color:var(--ok)}.cell.t{background:var(--maybe);color:#222;border-color:var(--maybe)}.cell.x{background:var(--ng);color:#fff;border-color:var(--ng)}
.cnt{font-size:13px;padding:7px 4px}.cnt.best{background:var(--best)}.cnt.sel{outline:2px solid var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.chips button{padding:5px 10px;font-size:13px}
</style>
</head>
<body>
<main>
  <h1 id="title">日程調整</h1>
  <div class="sub" id="lead"></div>
  <div id="app"><div class="msg">読み込み中…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const W=["日","月","火","水","木","金","土"];
function fmt(v){const [v0,e0]=String(v).split("~");const d=new Date(v0);if(isNaN(d))return v;const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}${e0?"〜"+e0:""}`}
const SYM={o:"○",t:"△",x:"×"};
let gen={s:"",e:"",t:"9:00-10:00, 14:00-15:00, 16:00-17:00",w:[0,1,1,1,1,1,0]};let db,adminKey=null,myId=null,canEdit=false,ev=null,votes=[],draft=null,editing=false,myAns={},myName="",ready=false;

const H={"Content-Type":"application/json"};
const em=location.pathname.match(/^\/e\/([\w-]+)/);
const eid=em?em[1]:null;
adminKey=new URLSearchParams(location.search).get("key");
try{if(adminKey)localStorage.setItem("ak:"+eid,adminKey);else if(eid)adminKey=localStorage.getItem("ak:"+eid);myId=localStorage.getItem("vid:"+eid)}catch(e){}
if(!myId){myId=((crypto.randomUUID&&crypto.randomUUID())||Date.now()+Math.random().toString(36).slice(2)).replace(/[^\w-]/g,"");try{localStorage.setItem("vid:"+eid,myId)}catch(e){}}
canEdit=!eid||!!adminKey;
async function load(){
  if(!eid){render();return}
  try{
    const r=await fetch("/api/events/"+eid);if(!r.ok)throw 0;const d=await r.json();
    ev={title:d.title,slots:d.slots};votes=d.votes;
    const m=votes.find(v=>v.id===myId);
    if(m&&!window._touched){myAns=Object.fromEntries(Object.entries(m.answers||{}).filter(([k,v])=>v==="o"||v==="t"));myName=m.name}
    if(!editing)render();
  }catch(e){if(!ev)$("#app").innerHTML='<div class="msg">イベントが見つかりません。</div>'}
}
async function init(){await load();if(eid)setInterval(()=>{if(!editing&&!document.hidden&&!window._touched)load()},10000)}
function showLinks(id,key){
  const u=location.origin+"/e/"+id,a=u+"?key="+key;
  $("#title").textContent="候補日を作成しました";$("#lead").textContent="";
  const box=(t,sub,v,i)=>`<div class="card"><h2>${t}</h2><div class="sub">${sub}</div><input readonly value="${v}" onclick="this.select()" style="margin-top:6px"><button class="${i?"":"pri"}" data-v="${v}" style="width:100%;margin-top:8px">コピー</button></div>`;
  $("#app").innerHTML=box("参加者に送るリンク","このリンクを知っている人が回答できます",u,0)+box("主催者用リンク(自分だけ保管)","候補日の編集ができます。他の人には送らないでください",a,1)+`<a href="${a}"><button style="width:100%">回答ページを開く</button></a>`;
  $("#app").querySelectorAll("button[data-v]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.v);b.textContent="コピーしました ✓"}catch(e){b.previousElementSibling.select()}});
}
const dOf=l=>l.slice(0,10),tOf=l=>l.slice(11);
const dlabel=ds=>{const d=new Date(ds+"T00:00");return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})`};
const tlabel=t=>t.replace("~","〜").replace(/(^|〜)0(\d:)/g,"$1$2");
function layout(slots){
  const ds=[...new Set(slots.map(s=>dOf(s.label)))].sort(),ts=[...new Set(slots.map(s=>tOf(s.label)))].sort(),map={};
  slots.forEach(s=>map[dOf(s.label)+"|"+tOf(s.label)]=s);return{ds,ts,map};
}
function table(slots,cell){
  const{ds,ts,map}=layout(slots);
  return `<div class="scroll"><table class="g"><thead><tr><th class="n">日付</th>${ts.map(t=>`<th>${esc(tlabel(t))}</th>`).join("")}</tr></thead><tbody>${ds.map(d=>`<tr><th class="n">${dlabel(d)}</th>${ts.map(t=>{const s=map[d+"|"+t];return s?cell(s):'<td class="none">–</td>'}).join("")}</tr>`).join("")}</tbody></table></div>`;
}
let sel=null;
function render(){
  const app=$("#app");
  if(editing||(!ev&&canEdit)){return renderEditor(app)}
  if(!ev){$("#title").textContent="日程調整";$("#lead").textContent="";app.innerHTML='<div class="msg">まだ候補日が設定されていません。<br>主催者の設定をお待ちください。</div>';return}
  $("#title").textContent=ev.title||"日程調整";
  $("#lead").textContent="マスをタップ:行ける所は ○、調整すれば行ける所は △(選ばなかった所は × 扱い)";
  const slots=ev.slots||[],sc={};
  slots.forEach(s=>{let o=0,t=0;votes.forEach(v=>{const a=v.answers?.[s.id];if(a==="o")o++;else if(a==="t")t++});sc[s.id]={o,t,x:votes.length-o-t}});
  let best=null;
  if(votes.length)slots.forEach(s=>{const c=sc[s.id],b=best&&sc[best.id];if(!best||c.o>b.o||(c.o===b.o&&(c.t>b.t||(c.t===b.t&&c.x<b.x))))best=s});
  if(!sel||!slots.some(s=>s.id===sel))sel=best?best.id:null;
  let h=`<div class="card"><h2>あなたの回答</h2>
  <input id="name" placeholder="お名前" value="${esc(myName)}" maxlength="30">
  <div style="margin-top:8px">${table(slots,s=>{const a=myAns[s.id]||"";return `<td><button class="cell ${a}" data-s="${s.id}">${a?SYM[a]:"·"}</button></td>`})}</div>
  <button class="pri" id="save" style="width:100%;margin-top:10px">回答を保存</button></div>
  <div class="card"><h2>みんなの回答 (${votes.length}人)</h2>`;
  if(!votes.length)h+='<div class="sub">まだ回答がありません。</div>';
  else h+=`<div style="margin-bottom:8px"><span class="chip">最有力</span> ${esc(fmt(best.label))}</div>`
    +table(slots,s=>{const c=sc[s.id];return `<td><button class="cnt ${s.id===best.id?"best":""}" data-s="${s.id}"><span class="o">${c.o}</span>/<span class="t">${c.t}</span>/<span class="x">${c.x}</span></button></td>`})
    +'<div class="sub" style="margin-top:6px">数字は ○/△/× の人数(× は選ばなかった人)。タップで内訳を表示</div><div id="detail"></div>';
  h+="</div>";
  if(canEdit)h+='<button id="edit" style="width:100%">候補日を編集</button>';
  app.innerHTML=h;
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{
    window._touched=true;const id=b.dataset.s,o=["","o","t"],n=o[(o.indexOf(myAns[id]||"")+1)%3];
    myAns[id]=n||undefined;b.className="cell "+n;b.textContent=n?SYM[n]:"·"});
  $("#name").oninput=e=>{myName=e.target.value;window._touched=true};
  const showDetail=()=>{
    const s=slots.find(x=>x.id===sel);if(!s||!$("#detail"))return;
    app.querySelectorAll(".cnt").forEach(b=>b.classList.toggle("sel",b.dataset.s===sel));
    const by=k=>votes.filter(v=>k==="x"?!["o","t"].includes(v.answers?.[sel]):v.answers?.[sel]===k).map(v=>esc(v.name||"名無し")).join("、")||"–";
    $("#detail").innerHTML=`<div class="card" style="margin:8px 0 0"><b>${esc(fmt(s.label))}</b><div class="o">○ ${by("o")}</div><div class="t">△ ${by("t")}</div><div class="x">× ${by("x")}</div></div>`};
  app.querySelectorAll(".cnt").forEach(b=>b.onclick=()=>{sel=b.dataset.s;showDetail()});
  showDetail();
  $("#save").onclick=async()=>{
    const name=$("#name").value.trim();
    if(!name){alert("お名前を入力してください");return}
    if(!myId){alert("回答するにはログインが必要です");return}
    const answers={};Object.entries(myAns).forEach(([k,v])=>{if(v==="o"||v==="t")answers[k]=v});
    try{const r=await fetch("/api/events/"+eid+"/votes",{method:"POST",headers:H,body:JSON.stringify({id:myId,name,answers})});if(!r.ok)throw 0;await load();window._touched=false;$("#save").textContent="保存しました ✓"}
    catch(e){alert("保存できませんでした(権限をご確認ください)")}
  };
  if($("#edit"))$("#edit").onclick=()=>{draft={title:ev.title,slots:[...ev.slots]};editing=true;render()};
}

function renderEditor(app){
  if(!draft)draft=ev?{title:ev.title,slots:[...(ev.slots||[])]}:{title:"",slots:[]};
  $("#title").textContent="候補日を設定";$("#lead").textContent="主催者向け:会議名と候補日時を登録します";
  app.innerHTML=`<div class="card"><h2>会議名</h2><input id="t" placeholder="例:企画定例ミーティング" value="${esc(draft.title)}">
  <h2 style="margin-top:14px">まとめて追加</h2>
  <div class="row"><input type="date" id="gs" value="${gen.s}"><span style="flex:none">〜</span><input type="date" id="ge" value="${gen.e}"></div>
  <div class="wd">${W.map((d,i)=>`<button data-w="${i}" class="${gen.w[i]?"on":""}">${d}</button>`).join("")}</div>
  <input id="gt" placeholder="時間 or 時間帯(カンマ区切り)例: 9:00-10:00, 14:00" value="${esc(gen.t)}">
  <div class="row" style="margin-top:8px"><button class="pri" id="gen">この条件で候補を追加</button><button id="clr">全削除</button></div>
  <h2 style="margin-top:14px">候補日時 (${draft.slots.length}件)</h2>
  <div class="row"><input type="datetime-local" id="dt"><input type="time" id="dte" style="flex:.6" aria-label="終了時刻(任意)"><button id="add">追加</button></div>
  <div class="sub" style="margin-top:4px">左:開始日時 / 中央:終了時刻(任意)</div>
  <div style="margin-top:8px">${(()=>{const{ds}=layout(draft.slots);return ds.length?ds.map(d=>`<div class="slot"><b style="min-width:72px">${dlabel(d)}</b><span class="chips">${draft.slots.filter(s=>dOf(s.label)===d).map(s=>`<button class="x-del" data-id="${s.id}">${esc(tlabel(tOf(s.label)))} ✕</button>`).join("")}</span></div>`).join(""):'<div class="sub">候補日がまだありません</div>'})()}</div></div>
  <button class="pri" id="done" style="width:100%">${ev?"更新する":"公開する"}</button>
  ${ev?'<button id="cancel" style="width:100%;margin-top:8px">キャンセル</button>':""}`;
  $("#t").oninput=e=>draft.title=e.target.value;
  $("#gs").oninput=e=>{gen.s=e.target.value;if(!gen.e)$("#ge").value=gen.e=gen.s};$("#ge").oninput=e=>gen.e=e.target.value;$("#gt").oninput=e=>gen.t=e.target.value;
  app.querySelectorAll(".wd button").forEach(b=>b.onclick=()=>{gen.w[+b.dataset.w]^=1;b.classList.toggle("on")});
  $("#clr").onclick=()=>{draft.slots=[];renderEditor(app)};
  $("#gen").onclick=()=>{
    if(!gen.s||!gen.e||gen.e<gen.s){alert("開始日と終了日を正しく選んでください");return}
    const times=gen.t.split(/[,、]+/).map(x=>x.replace(/\s+/g,"").replace(/[〜～~ー–—−‐-]+/g,"~")).map(x=>{const m=x.match(/^(\d{1,2}):(\d{2})(?:~(\d{1,2}):(\d{2}))?$/);return m?m[1].padStart(2,"0")+":"+m[2]+(m[3]?"~"+m[3].padStart(2,"0")+":"+m[4]:""):null}).filter(Boolean);
    if(!times.length){alert("時間を 10:00 の形式で入力してください");return}
    const p=n=>String(n).padStart(2,"0"),have=new Set(draft.slots.map(s=>s.label));
    const d=new Date(gen.s+"T00:00"),end=new Date(gen.e+"T00:00");let n=0;
    for(let i=0;d<=end&&i<92;i++,d.setDate(d.getDate()+1)){
      if(!gen.w[d.getDay()])continue;
      const ds=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
      times.forEach(t=>{const l=ds+"T"+t;if(!have.has(l)){have.add(l);draft.slots.push({id:"s"+Date.now().toString(36)+(n++),label:l})}});
    }
    draft.slots.sort((a,b)=>a.label<b.label?-1:1);renderEditor(app);
  };
  $("#add").onclick=()=>{const v0=$("#dt").value;if(!v0)return;const v=v0+($("#dte").value?"~"+$("#dte").value:"");if(draft.slots.some(s=>s.label===v))return;
    draft.slots.push({id:"s"+Date.now().toString(36),label:v});draft.slots.sort((a,b)=>a.label<b.label?-1:1);renderEditor(app)};
  app.querySelectorAll(".x-del").forEach(b=>b.onclick=()=>{draft.slots=draft.slots.filter(s=>s.id!==b.dataset.id);renderEditor(app)});
  $("#done").onclick=async()=>{
    if(!draft.title.trim()||!draft.slots.length){alert("会議名と候補日を1つ以上入力してください");return}
    try{const body={title:draft.title.trim(),slots:draft.slots};
      if(!eid){const r=await fetch("/api/events",{method:"POST",headers:H,body:JSON.stringify(body)});if(!r.ok)throw 0;const d=await r.json();editing=false;draft=null;return showLinks(d.id,d.adminKey)}
      const r=await fetch("/api/events/"+eid,{method:"PUT",headers:H,body:JSON.stringify({...body,adminKey})});if(!r.ok)throw 0;editing=false;draft=null;await load();return}
    catch(e){alert("保存できませんでした");return}
    render();
  };
  if($("#cancel"))$("#cancel").onclick=()=>{editing=false;draft=null;render()};
}
init();
</script>
</body>
</html>
